name: CI
on:
  pull_request:
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Export lockfile for maintainer review (temporary)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/E01-foundations'
        run: node -e 'const fs = require("node:fs"); const b = fs.readFileSync("package-lock.json").toString("base64"); for (let i=0;i<b.length;i+=1000) console.log("ADC_LOCK_CHUNK:"+b.slice(i,i+1000)); console.log("ADC_LOCK_END:"+b.length)'
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            package-lock.json
            test-results/
          if-no-files-found: ignore
